name: Deploy & Release to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Permissions for GitHub Pages deployment and GitHub Releases / Tag creation
permissions:
  contents: write
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build, Test & Index Songs
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.calc_version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine Release Version
        id: calc_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch all remote tags
          git fetch --tags

          # Check if current commit is already tagged
          EXISTING_TAG=$(git describe --exact-match --tags HEAD 2>/dev/null || true)
          if [ -n "$EXISTING_TAG" ]; then
            echo "Current commit already has tag: $EXISTING_TAG"
            NEXT_TAG="$EXISTING_TAG"
          else
            # Find highest existing SemVer tag matching v*.*.*
            LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)

            if [ -z "$LATEST_TAG" ]; then
              NEXT_TAG="v1.0.0"
            else
              VERSION="${LATEST_TAG#v}"
              MAJOR=$(echo "$VERSION" | cut -d. -f1)
              MINOR=$(echo "$VERSION" | cut -d. -f2)
              PATCH=$(echo "$VERSION" | cut -d. -f3)

              # Fetch Pull Request title and body/description directly from GitHub API
              PR_INFO=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0] | "\(.title) \(.body)"' 2>/dev/null || true)

              # Also inspect commit subject, commit body, event payload, and recent branch commits
              COMMIT_MSG=$(git log -1 --pretty=%B)
              EVENT_MSG="${{ github.event.head_commit.message }}"
              BRANCH_LOG=$(git log -n 30 --pretty=%B 2>/dev/null || true)
              SEARCH_TEXT="${PR_INFO} ${COMMIT_MSG} ${EVENT_MSG} ${BRANCH_LOG}"

              echo "Searching for version bump directives in PR & commit metadata..."

              if echo "$SEARCH_TEXT" | grep -iqE "(#major|\[major\]|bump:\s*major)"; then
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
              elif echo "$SEARCH_TEXT" | grep -iqE "(#minor|\[minor\]|bump:\s*minor)"; then
                MINOR=$((MINOR + 1))
                PATCH=0
              else
                PATCH=$((PATCH + 1))
              fi

              NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          echo "Determined version: $NEXT_TAG"
          echo "tag=$NEXT_TAG" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$NEXT_TAG" >> $GITHUB_ENV

      - name: Verify TypeScript compilation
        run: npx tsc --noEmit

      - name: Run unit test suite
        run: npm test -- --browsers=ChromeHeadlessCI

      - name: Run song indexing & production build
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/my-ui-app/browser'

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Create Tag & GitHub Release
    runs-on: ubuntu-latest
    needs: [build, deploy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Version Tag & GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          git fetch --tags

          TAG_TO_RELEASE="${RELEASE_TAG:-v1.0.0}"

          # Check if this tag already exists in git
          if git rev-parse "$TAG_TO_RELEASE" >/dev/null 2>&1; then
            echo "Tag $TAG_TO_RELEASE already exists. Skipping duplicate tag/release creation."
            exit 0
          fi

          echo "Publishing release version: $TAG_TO_RELEASE"

          # Configure git user identity for tagging
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Tag the release commit and push to remote
          git tag -a "$TAG_TO_RELEASE" -m "Release $TAG_TO_RELEASE"
          git push origin "$TAG_TO_RELEASE"

          # Create official GitHub Release with auto-generated release notes
          gh release create "$TAG_TO_RELEASE" \
            --title "Release $TAG_TO_RELEASE" \
            --generate-notes
